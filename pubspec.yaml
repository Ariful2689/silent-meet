name: silent_meet
description: "Auto silent/vibrate scheduler with world clock, multilingual UI, and local JSON storage."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Notifications (silent/vibrate schedule alerts, pre-meeting alerts)
  flutter_local_notifications: ^17.2.2

  # Localisation (English + Bengali) and date/time formatting
  intl: ^0.19.0

  # Local JSON persistence
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Time zone calculations for world clock
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
